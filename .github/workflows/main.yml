name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          test-results/
          test-artifacts/
        retention-days: 30

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: test-results/html-report/
        retention-days: 30

    - name: Comment PR with test results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = 'test-results/test-results.json';
          
          if (fs.existsSync(path)) {
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            const { stats } = results;
            
            const message = `## 🎭 Playwright Test Results
            
            | Result | Count |
            |--------|--------|
            | ✅ Passed | ${stats.expected || 0} |
            | ❌ Failed | ${stats.unexpected || 0} |
            | ⏭️ Skipped | ${stats.skipped || 0} |
            | 🔄 Flaky | ${stats.flaky || 0} |
            
            **Total Tests**: ${stats.expected + stats.unexpected + stats.skipped + stats.flaky}
            **Duration**: ${(results.duration / 1000).toFixed(2)}s
            
            ${stats.unexpected > 0 ? '❌ Some tests failed. Check the detailed report in the artifacts.' : '✅ All tests passed!'}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
          }

  # Optional: Deploy test results to GitHub Pages
  deploy-report:
    if: always() && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Download HTML report
      uses: actions/download-artifact@v4
      with:
        name: playwright-html-report
        path: ./html-report

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./html-report

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
